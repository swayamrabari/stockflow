dependencies = [
    "django>=6.1.2",
    "django-tailwind-cli>=4.8.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]


[tool.ruff.format]
quote-style = "single"

