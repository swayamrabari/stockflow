{% extends 'base.html' %}
{% block title %}Delete sale &middot; StockFlow{% endblock %}

{% block content %}
<main class="page max-w-2xl">
  <section class="card">
    <h1 class="text-2xl font-bold tracking-tight">Delete sale</h1>
    <p class="mt-1 text-sm text-neutral-600">This action cannot be undone.</p>
    <p class="mt-3 text-sm text-neutral-600">
      Are you sure you want to delete
      <span class="font-medium text-neutral-900"
        >"Sale #{{ object.pk }}"</span
      >
      for {{ object.customer.name }}?
    </p>

    <form method="post" class="mt-6 flex flex-wrap items-center gap-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">
        Delete sale
      </button>
      <a
        href="{% url 'sales_order_detail' object.pk %}"
        class="btn btn-secondary"
        >Cancel</a
      >
    </form>
  </section>
</main>
{% endblock %}
