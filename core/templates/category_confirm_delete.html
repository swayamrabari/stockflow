{% extends 'base.html' %}
{% block title %}Delete category &middot; StockFlow{% endblock %}

{% block content %}
<main class="page max-w-2xl">
  <section class="card">
    <h1 class="text-2xl font-bold tracking-tight">Delete category</h1>
    <p class="mt-1 text-sm text-neutral-600">
      This action cannot be undone.
    </p>
    <p class="mt-3 text-sm text-neutral-600">
      Are you sure you want to delete
      <span class="font-medium text-neutral-900">"{{ object.name }}"</span>?
    </p>

    <form method="post" class="mt-6 flex flex-wrap items-center gap-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Delete category</button>
      <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </section>
</main>
{% endblock %}
