{% extends 'base.html' %}
{% block title %}Access denied &middot; StockFlow{% endblock %}

{% block content %}
<main class="flex flex-1 items-center justify-center p-4 sm:p-8">
  <section class="card w-full max-w-md text-center">
    <span
      class="mb-4 inline-flex h-11 w-11 items-center justify-center bg-black text-[0.9375rem] font-bold text-white"
      aria-hidden="true"
      >SF</span
    >
    <p class="text-[2rem] font-bold tracking-tight">403</p>
    <h1 class="mt-1 text-[1.375rem] font-bold tracking-tight">Access denied</h1>
    <p class="mt-1.5 text-sm text-neutral-600">{{ exception }}</p>

    <a href="{% url 'home' %}" class="btn btn-primary mt-6 w-full"
      >Back to home</a
    >
  </section>
</main>
{% endblock %}
